# CI: Typecheck, Lint (Biome), Tests, Docker-Build + Smoke-Test,
# danach Multi-Arch-Image nach GHCR (nur push auf main, Tags v*, manuell).
# pnpm verwaltet die Abhängigkeiten, Bun führt aus.
name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository }}

# Nur ein Lauf pro Ref, ältere werden abgebrochen
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      # Version kommt aus packageManager in package.json
      - uses: pnpm/action-setup@v4

      # Node nur für pnpm und tsc; setup-node cached den pnpm-Store
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Dependencies installieren
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      # Biome: Lint + Formatierung (src, test, scripts, web)
      - name: Statische Analyse
        run: pnpm lint

      - name: Tests
        run: pnpm test

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      # Image nur lokal bauen, nicht pushen
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: mcp-geocoder:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Container starten, Health-Endpoint prüfen, bei Fehler Logs zeigen
      - name: Smoke-Test
        run: |
          docker run -d -p 8080:8080 --name geocoder mcp-geocoder:ci
          for i in $(seq 1 15); do
            if curl -fsS http://localhost:8080/health >/dev/null 2>&1; then
              echo "health ok nach ${i}s"; break
            fi
            sleep 1
          done
          curl -fsS http://localhost:8080/health || { docker logs geocoder; exit 1; }
          docker rm -f geocoder

  # Image nach GHCR pushen. Läuft nicht für Pull Requests (kein Zugriff auf packages:write
  # aus Forks, und PR-Images will niemand). Tags:
  #   main            -> :main, :latest, :sha-<kurz>
  #   Tag v1.2.3      -> :1.2.3, :1.2, :1, :latest
  #   workflow_dispatch -> :<branch>
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: docker
    if: github.event_name != 'pull_request'
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      # arm64 für Apple Silicon (stdio-Nutzung lokal), amd64 für Server
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags + OCI-Labels (source, revision, version). Das source-Label verknüpft
      # das Package mit dem Repo, dann übernimmt GHCR README und Sichtbarkeit.
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable={{is_default_branch}}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
